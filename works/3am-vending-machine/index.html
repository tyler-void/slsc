<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 A.M. Vending Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;800&family=DotGothic16&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#05080d;
  --paper:#e6ecf0;
  --mute:#8f9ca9;
  --line:#243242;
  --panel:rgba(8,12,18,.9);
  --amber:#ffae3b;
  --amber-glow:rgba(255,174,59,.45);
  --cold:#3f8cff;
  --hot:#ff5645;
  --f-title:"Big Shoulders Stencil", Impact, "Arial Narrow", sans-serif;
  --f-led:"DotGothic16", ui-monospace, "Courier New", monospace;
  --f-ui:"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.title{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 20px);left:20px;right:20px;max-width:30rem;pointer-events:none;transition:opacity .8s ease}
.ep{margin:0 0 8px;font:14px/1 var(--f-led);color:var(--amber);letter-spacing:.08em;text-shadow:0 0 12px var(--amber-glow)}
.title h1{margin:0;font:800 clamp(34px,4.8vw,64px)/.86 var(--f-title);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.log{margin:12px 0 0;max-width:24rem;color:var(--mute);font-size:15px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.hud{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:28px 20px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;pointer-events:none;background:linear-gradient(to top,rgba(3,5,8,.75),rgba(3,5,8,0));transition:opacity .6s}
.hint{margin:0;color:var(--mute);font-size:14px;max-width:34rem}
.actions{display:flex;gap:8px;pointer-events:auto}
.btn{font:600 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:rgba(8,12,18,.75);border:1px solid var(--line);padding:11px 14px;border-radius:3px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:#3b4d60;background:rgba(18,26,36,.9)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:#1b1206;border-color:var(--amber)}
.btn.primary:hover{background:#ffc06a;border-color:#ffc06a}
.btn:focus-visible,.drink:focus-visible,.close:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{position:fixed;z-index:5;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:min(390px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.eyebrow{margin:0 0 6px;font:12px/1 var(--f-led);color:var(--amber);letter-spacing:.08em}
.panel h2{margin:0;font:800 30px/.95 var(--f-title);text-transform:uppercase;letter-spacing:.01em}
.close{flex:none;background:none;border:1px solid var(--line);color:var(--paper);width:34px;height:34px;border-radius:3px;font:20px/1 var(--f-ui);cursor:pointer}
.close:hover{border-color:#3b4d60}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.drink{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:9px;row-gap:5px;align-items:center;text-align:left;background:#0d141c;border:1px solid #1f2b38;border-radius:3px;padding:10px 9px;color:var(--paper);cursor:pointer;min-height:66px;transition:border-color .15s,background .15s}
.drink:hover{border-color:#40576e;background:#111b25}
.drink[aria-disabled="true"]{opacity:.45;cursor:progress}
.can{grid-row:1 / span 2;width:14px;height:32px;border-radius:3px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.28) 35%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45)),linear-gradient(var(--c0) 0 58%,var(--c1) 58% 100%);box-shadow:inset 0 3px 0 #9aa3ab,inset 0 -3px 0 #8a939b}
.nm{font:700 16px/1 var(--f-title);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;align-items:center;font:13px/1 var(--f-led)}
.price{color:var(--amber);font-variant-numeric:tabular-nums}
.tag{font:600 10px/1 var(--f-ui);letter-spacing:.1em;padding:3px 4px;border-radius:2px;color:#fff}
.tag.cold{background:var(--cold)}
.tag.hot{background:var(--hot)}
.tag.mystery{background:#2a2a2a;color:var(--amber)}
.tag.free{background:#2f6fa3}
.foot{margin:12px 0 0;color:var(--mute);font-size:13px}
.toast{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:max-content;max-width:min(440px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:4px;font-size:14px;color:var(--paper);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.toast b{display:block;margin-bottom:4px;font:700 19px/1 var(--f-title);text-transform:uppercase;letter-spacing:.01em}
.toast em{color:var(--mute);font-style:normal}
body.panel-open .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 20px)}
.title.dim{opacity:.8}
.subtitle{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:0;height:11vh;display:flex;align-items:center;justify-content:center;margin:0;width:max-content;max-width:calc(100vw - 40px);text-align:center;font:clamp(16px,2.2vw,25px)/1.35 var(--f-led);color:var(--amber);letter-spacing:.05em;text-shadow:0 0 14px var(--amber-glow),0 2px 6px #000;opacity:0;transition:opacity .35s}
.subtitle.on{opacity:1}
.bar{position:fixed;z-index:1;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height 1.2s cubic-bezier(.6,0,.2,1)}
.bar.top{top:0}
.bar.bottom{bottom:0}
body.cine .bar{height:11vh}
body.cine .hud,body.cine .title{opacity:0}
body.cine .actions{pointer-events:none}
.boot{position:fixed;z-index:6;inset:0;display:grid;place-items:center;background:var(--ink);color:var(--amber);font:16px/1.4 var(--f-led);letter-spacing:.06em;text-align:center;padding-inline:24px;transition:opacity .9s}
.boot.gone{opacity:0;pointer-events:none}
.boot.fail{color:var(--paper);font-family:var(--f-ui)}
@media (max-width:640px){
  .title{left:16px;right:16px}
  .log{font-size:13px;max-width:18rem}
  .hud{padding-left:16px;padding-right:16px}
  .hint{font-size:13px;flex-basis:100%}
  .actions{width:100%}
  .actions .btn{flex:1}
  .panel{left:16px;right:16px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);padding:12px}
  .panel h2{font-size:24px}
  .drink{grid-template-columns:1fr;justify-items:start;min-height:0;padding:8px;row-gap:6px}
  .can{grid-row:auto;width:12px;height:22px}
  .nm{font-size:14px}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 118px)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="gl" tabindex="-1" aria-label="A rainy bus stop at 3 a.m. with a glowing vending machine and a cat"></canvas>
<div class="bar top" aria-hidden="true"></div>
<div class="bar bottom" aria-hidden="true"></div>

<header class="title" id="title">
  <p class="ep">EP.01 · SMALL HOURS</p>
  <h1>3 A.M. Vending Machine</h1>
  <p class="log">A bus stop in the rain. A machine that never closes. One regular, most nights.</p>
</header>

<p class="subtitle" id="subtitle" aria-live="polite"></p>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="hud">
  <p class="hint" id="hint">Drag to look around. Scroll or pinch to zoom. Click the machine.</p>
  <div class="actions">
    <button class="btn primary" id="btnBuy" type="button">Buy a drink</button>
    <button class="btn" id="btnSound" type="button" aria-pressed="false">Sound off</button>
  </div>
</footer>

<aside class="panel" id="panel" hidden aria-label="Vending machine">
  <div class="panel-head">
    <div>
      <p class="eyebrow">SMALL HOURS · MACHINE Nº 0300</p>
      <h2>Pick a drink</h2>
    </div>
    <button class="close" id="btnClose" type="button" aria-label="Close the machine panel">×</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot">You have exact change. You always do.</p>
</aside>

<div class="boot" id="boot">Warming up the machine…</div>

<script>
  setTimeout(function () {
    if (!window.__sceneBooted) {
      var b = document.getElementById('boot');
      if (b) { b.textContent = 'The 3D library didn’t load. It comes from cdn.jsdelivr.net, so check your connection and reload.'; b.classList.add('fail'); }
    }
  }, 15000);
</script>

function drawCan2D(g, cx, bottom, w, h, d) {

    await wait(2600);
    for (const [text, beat] of LINES) {
      const dur = marquee.set(text, { loop: false, speed: 90 }); subtitle(text); sfx.blip();
      if (beat === 1) dispPulse = 1;
      if (beat === 2) { cat.lookCam = 0; await wait(900); await dispenseTin(); }
      await wait(Math.max(3200, dur * 1000 + 300) - (beat === 2 ? 2600 : 0));
    }
    subtitle('');
    state.twistDone = true; buildPanel(); drawDisplay();
    sim.target = 1; sfx.slow(false); flick.override = 'return';
    marquee.set('SMALL HOURS · OPEN 24H · SEE YOU AT 3 · SMALL HOURS · OPEN 24H · SEE YOU AT 3 · ', { loop: true, speed: 34 });
    lcd('INSERT COIN');
    document.body.classList.remove('cine');
    ui.foot.textContent = 'The last button is lit now. It’s for her.';
    await wait(1200);
    state.twistActive = false; setBusy(false);
  }

  /* ============================================================
     Pointer: click the machine or the cat
     ============================================================ */
  const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
  const pickables = [machine, cat.g];
  function pick(ev) {
    const r = canvas.getBoundingClientRect(); ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera); const hit = ray.intersectObjects(pickables, true)[0];
    return hit ? hit.object.userData.kind : null;
  }
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; state.idle = 0; });
  canvas.addEventListener('pointerup', (e) => {
    if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null; if (moved > 6) return;
    const k = pick(e);
    if (k === 'machine') openPanel();
    else if (k === 'cat') { sfx.mrrp(); cat.lookCam = 3; cat.blink = 0; }
  });
  let hoverQueued = false, lastMove = null;
  canvas.addEventListener('pointermove', (e) => { lastMove = e; if (hoverQueued || COARSE) return; hoverQueued = true; requestAnimationFrame(() => { hoverQueued = false; const k = pick(lastMove); canvas.style.cursor = k ? 'pointer' : 'grab'; if (k === 'cat') cat.lookCam = Math.max(cat.lookCam, 1.2); }); });
  canvas.addEventListener('wheel', () => { state.idle = 0; }, { passive: true });

  /* ============================================================
     Loop
     ============================================================ */
  let lastT = performance.now(), now = 0, nextT = 0;
  // open with #fps to see frame rate and render resolution
  const fpsHud = location.hash === '#fps' ? document.body.appendChild(Object.assign(document.createElement('div'), { style: 'position:fixed;z-index:9;top:8px;right:8px;font:12px ui-monospace,monospace;color:#8dffc8;background:rgba(0,0,0,.6);padding:4px 6px;pointer-events:none' })) : null;
  let flashT = -1, nextFlash = 20 + rand() * 25, thunderAt = -1;
  let nextFlicker = 6 + rand() * 8, flickerT = -1;
  let blinkClock = 0, colonClock = 0, colon = true;
  let autoDir = 1;
  const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();

  function updateCat(dt, now) {
    // where to look
    let target;
    if (cat.eat > 0) target = tinGroup.position;
    else if (flights.length) target = flights[0].mesh.position;
    else if (state.twistActive) target = tmpV2.set(MX, SW_Y + 1.7, MFRONT);
    else if (cat.lookCam > 0) target = camera.position;
    else target = mothCentroid;
    cat.lookCam = Math.max(0, cat.lookCam - dt);
    cat.head.getWorldPosition(tmpV);
    const local = cat.g.worldToLocal(target.clone()).sub(cat.head.position);
    let yaw = Math.atan2(local.x, local.z), pitch = Math.atan2(-local.y, Math.hypot(local.x, local.z));
    yaw = THREE.MathUtils.clamp(yaw, -1.2, 1.2); pitch = THREE.MathUtils.clamp(pitch, -.75, .8);
    if (cat.eat > 0) { cat.eat -= dt; pitch = .75 + Math.sin(now * 7) * .08; }
    const k = 1 - Math.exp(-dt * (cat.eat > 0 ? 6 : 3.5));
    cat.yaw += (yaw - cat.yaw) * k; cat.pitch += (pitch - cat.pitch) * k;
    cat.head.rotation.set(cat.pitch, cat.yaw, 0, 'YXZ');
    // blinking
    cat.nextBlink -= dt; if (cat.nextBlink <= 0) { cat.blink = 0; cat.nextBlink = 2.5 + rand() * 4; }
    cat.blink = Math.min(1, cat.blink + dt * 7);
    const bl = cat.blink < .5 ? 1 - cat.blink * 2 : (cat.blink - .5) * 2;
    const open = Math.max(.08, 1 - (1 - bl));
    cat.dilate += ((state.twistActive ? 1 : 0) - cat.dilate) * (1 - Math.exp(-dt * 1.5));
    cat.eyes.forEach((e) => { e.scale.y = open; });
    cat.pupils.forEach((p) => { p.scale.y = .95 * open; p.scale.x = lerp(.28, .85, cat.dilate); });
    // ear flicks
    cat.nextEar -= dt; if (cat.nextEar <= 0) { cat.earT = 1; cat.nextEar = 3 + rand() * 6; }
    cat.earT = Math.max(0, cat.earT - dt * 4);
    cat.ears[1].rotation.x = -Math.sin(cat.earT * Math.PI) * .5;
    // tail
    const happy = cat.eat > 0 ? 1 : 0;
    cat.tail.forEach((m, i) => {
      const s = i / (cat.tail.length - 1); const a = s * Math.PI * .82; const R = .115 - .012 * s;
      m.position.set(Math.sin(a) * R + Math.sin(now * 2.6 + s * 4) * .012 * s * s, .022 + .012 * Math.sin(s * Math.PI) + (happy * .09 + .02 * Math.max(0, Math.sin(now * 1.3))) * s * s * s, -Math.cos(a) * R);
      m.scale.setScalar(.021 - .008 * s);
    });
  }

  function frame(ts) {
    const t = ts ?? performance.now();
    if (t < nextT - 2) return;                    // averages 60 fps on 120/144/165 Hz screens
    nextT += FRAME_MS; if (t - nextT > FRAME_MS) nextT = t;
    const rdt = Math.min(Math.max(0, (t - lastT) / 1000), .25); lastT = t; now += rdt;
    const dt = Math.min(rdt, .05);
    sim.scale += (sim.target - sim.scale) * (1 - Math.exp(-dt * 1.4));
    sim.t += dt * sim.scale;
    const st = sim.t;

    // camera
    if (camTween.active) {
      camTween.t += rdt; const k = easeInOut(Math.min(1, camTween.t / camTween.dur));
      camera.position.lerpVectors(camTween.p0, camTween.p1, k); controls.target.lerpVectors(camTween.t0, camTween.t1, k); camera.lookAt(controls.target);
      if (k >= 1) { camTween.active = false; controls.enabled = true; controls.update(); camTween.res(); }
    } else {
      state.idle += dt;
      const auto = !REDUCED && state.idle > 12 && !state.panel && !state.twistActive;
      controls.autoRotate = auto;
      if (auto) { const az = controls.getAzimuthalAngle(); if (az > .95) autoDir = -1; if (az < .05) autoDir = 1; controls.autoRotateSpeed = .3 * autoDir; }
      controls.update(dt);
    }

    // fluorescent tube: occasional dips, dies during the twist
    let tube = 1;
    if (flick.override === 'die') { flick.level += (0 - flick.level) * (1 - Math.exp(-dt * 2.2)); tube = flick.level * (flick.level > .3 && Math.sin(now * 40) > .6 ? .3 : 1); }
    else if (flick.override === 'return') { flick.level += (1 - flick.level) * (1 - Math.exp(-dt * 1.2)); tube = flick.level; if (flick.level > .98) { flick.override = null; flick.level = 1; } }
    else if (!REDUCED) {
      nextFlicker -= dt; if (nextFlicker <= 0) { flickerT = 0; nextFlicker = 7 + rand() * 10; }
      if (flickerT >= 0) { flickerT += dt; tube = flickerT < .08 ? .35 : flickerT < .2 ? 1 : flickerT < .26 ? .45 : 1; if (flickerT > .3) flickerT = -1; }
    }
    tubeLight.intensity = TUBE_BASE * tube; tubeMat.color.copy(TUBE_COL).multiplyScalar(.08 + .92 * tube);
    lightUniforms.uL2c.value.set(.7, .95, .8).multiplyScalar(tube);
    sfx.setBuzz(tube);

    // lightning
    if (!REDUCED && !state.twistActive) { nextFlash -= dt; if (nextFlash <= 0) { flashT = 0; nextFlash = 35 + rand() * 40; thunderAt = now + 1.2 + rand() * 2.2; } }
    let flash = 0;
    if (flashT >= 0) { flashT += dt; flash = flashT < .07 ? 1 : flashT < .16 ? .25 : flashT < .22 ? .75 : Math.exp(-(flashT - .22) * 7) * .75; if (flashT > 1.2) flashT = -1; }
    if (thunderAt > 0 && now > thunderAt) { sfx.thunder(); thunderAt = -1; }
    hemi.intensity = HEMI_BASE + flash * 2.5; skyMat.uniforms.uFlash.value = flash * .55; lightUniforms.uFlash.value = flash * .6;

    // amber signal: 1 Hz
    const amb = (Math.sin(now * Math.PI * 2) > 0) ? 1 : 0; const ambS = amber.userData.s = lerp(amber.userData.s || 0, amb, 1 - Math.exp(-dt * 25));
    amber.intensity = 30 * ambS; amberLamp.material.color.setRGB(3.5 * ambS, 1.9 * ambS, .2 * ambS);

    // TV glow in the upstairs window
    tvWindows.forEach((m) => { const n = noise(now * 3, 5) * .6 + noise(now * 11, 9) * .4; m.color.setRGB(.15 + .25 * n, .25 + .35 * n, .6 + .6 * n); });

    // machine display: blinking mystery LED, pulse during the twist
    blinkClock += dt; if (blinkClock > .5) { blinkClock = 0; if (!state.twistDone) { disp.blink = !disp.blink; drawDisplay(); } }
    colonClock += dt; if (colonClock > .5) { colonClock = 0; colon = !colon; drawTimetable(colon); }
    dispPulse = Math.max(0, dispPulse - dt * .35);
    const pulse = Math.sin(Math.min(1, 1 - dispPulse) * Math.PI) * (dispPulse > 0 ? 1 : 0);
    dispMat.color.setScalar(DISP_BRIGHT * (1 + pulse * .6));
    machineRect.intensity = 9 * (1 + pulse * .6);
    marquee.update(dt);

    // flap kick
    flapKick = Math.max(0, flapKick - dt * 2.5); flap.rotation.x = -Math.sin(flapKick * Math.PI) * .6;

    // moths
    mothCentroid.set(0, 0, 0);
    moths.forEach((m) => {
      const a = st * m.sp + m.ph;
      tmpV.set(
        MOTH_C.x + Math.cos(a) * m.rad * 1.6 + Math.sin(st * 1.7 + m.ph) * .05,
        MOTH_C.y + m.y + Math.sin(st * m.bob * 2.3 + m.ph) * .12,
        MOTH_C.z + Math.sin(a) * m.rad * .55
      );
      const bonk = Math.pow(Math.max(0, Math.sin(st * .5 + m.bonk)), 18);
      tmpV.z = lerp(tmpV.z, MFRONT + .035, bonk);
      m.prev.copy(m.g.position); m.g.position.copy(tmpV);
      if (m.prev.distanceToSquared(tmpV) > 1e-8) { tmpV2.copy(tmpV).add(tmpV).sub(m.prev); m.g.lookAt(tmpV2); }
      const flapA = Math.sin(st * 42 + m.ph * 7) * .9; m.r.rotation.z = flapA; m.l.rotation.z = -flapA;
      mothCentroid.add(tmpV);
    });
    mothCentroid.multiplyScalar(1 / moths.length);

    // cans in flight
    for (let i = flights.length - 1; i >= 0; i--) {
      const f = flights[i]; f.t += dt / f.dur; const k = easeInOut(Math.min(1, f.t));
      f.curve.getPoint(k, f.mesh.position); f.mesh.rotation.z = Math.PI / 2 * (1 - k) + k * Math.PI * 4; f.mesh.rotation.x = k * Math.PI * 2;
      if (f.t >= 1) { f.mesh.rotation.set(0, rand() * 6, 0); f.onDone(); flights.splice(i, 1); sfx.tone('triangle', 1200, 900, .12, .04); }
    }
    // tin slide
    if (tinAnim.active) {
      tinAnim.t += dt / 1.6; const k = easeOut(Math.min(1, tinAnim.t));
      tinGroup.position.lerpVectors(tinAnim.from, tinAnim.to, k); tinGroup.rotation.y = k * 5.5;
      if (tinAnim.t > .8) tinLid.rotation.x = -Math.min(1, (tinAnim.t - .8) / .2) * 1.9;
      if (tinAnim.t >= 1) tinAnim.active = false;
    }

    updateCat(dt, now);

    // shader clocks
    rainMat.uniforms.uTime.value = st; rainMat.uniforms.uScale.value = sim.scale;
    splashMat.uniforms.uTime.value = st; dripMat.uniforms.uTime.value = st;
    mirror.material.uniforms.uTime.value = st;
    grainPass.uniforms.uTime.value = now;

    composer.render(dt);

    // FPS governor: drop resolution quickly when slow, creep back up when there's headroom
    gov.frames++;
    if (!gov.t0) gov.t0 = t;
    const span = t - gov.t0;
    if (span > 1500) {
      const fps = gov.frames * 1000 / span; gov.frames = 0; gov.t0 = t;
      if (fpsHud) fpsHud.textContent = `${fps.toFixed(0)} fps · ${renderer.domElement.width}×${renderer.domElement.height} · ${LITE ? 'lite' : 'full'}`;
      if (span < 4000) {
        if (fps < 45 && gov.q > gov.min) { gov.q = Math.max(gov.min, gov.q * (fps < 25 ? .72 : .87)); gov.good = 0; resize(); }
        else if (fps > 57 && gov.q < gov.max && ++gov.good >= 3) { gov.q = Math.min(gov.max, gov.q * 1.08); gov.good = 0; resize(); }
      }
    }
  }

  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => $('boot').classList.add('gone'));
  setTimeout(() => { $('title').classList.add('dim'); }, 9000);
}

function failBoot(msg) { const b = $('boot'); b.textContent = msg; b.classList.add('fail'); }
main().catch((err) => { console.error(err); failBoot('Something broke while building the scene: ' + (err && err.message ? err.message : err)); });
</script>
</body>
</html>
